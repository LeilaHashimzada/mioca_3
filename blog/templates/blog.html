{% extends "base.html" %}
{% load static %}


{% block title %}
<title>Blog</title>
{% endblock %}

{% block main %}

<!-- breadcrumb-area start -->
<div class="breadcrumb-area">
    <div class="container">
        <div class="row align-items-center justify-content-center">
            <div class="col-12 text-center">
                <h2 class="breadcrumb-title">Blogs</h2>
                <!-- breadcrumb-list start -->
                <ul class="breadcrumb-list">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active">Blogs</li>
                </ul>
                <!-- breadcrumb-list end -->
            </div>
        </div>
    </div>
</div>
<!-- breadcrumb-area end -->

<!-- Blog Area Start -->
<div class="blog-grid pb-100px pt-100px main-blog-page">
    <div class="container">
        <div class="row">

            {% for blog in blogs %}
            <!-- Blog Card -->
            <div class="col-lg-4 col-md-6 col-12 mb-40px">
                <div class="single-blog-post blog-grid-post">
                    <div class="blog-image" data-aos="fade-up" data-aos-delay="200">
                        <a href="{% url 'single_blog' blog.id %}">
                            <img class="img-fluid h-auto" src="{{blog.image.url}}" alt="{{blog.title}}" />
                        </a>
                    </div>
                    <div class="blog-post-content-inner mt-30px" data-aos="fade-up" data-aos-delay="400">
                        <div class="blog-athor-date">
                            <span> By,<a class="blog-author cercle-shape" href="#">{{blog.user.name}}</a></span>
                            <span class="blog-date" href="#">{{blog.created_at}}</span>
                        </div>
                        <h4 class="blog-title">
                            <a href="#">{{blog.title}}</a>
                        </h4>
                        <p data-aos="fade-up">
                            {{blog.content}}
                        </p>
                    </div>
                </div>
            </div>
            {% endfor %}


            

        </div>
    </div>
</div>
<!-- Blog Area End -->

{% endblock %}
