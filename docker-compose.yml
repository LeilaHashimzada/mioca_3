services:

  db:
    image: postgres:16
    restart: always
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdb:/var/lib/postgresql/data


  # Adminer Web UI
  adminer:
    image: adminer
    restart: always
    container_name: adminer_ui
    ports:
      - "8081:8080"
    depends_on:
      - db