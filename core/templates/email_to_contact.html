<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small contact form · email style</title>
  <style>
    /* minimal, clean styling – email‑client friendly */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f4f7fb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .form-card {
      max-width: 460px;
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.02);
      padding: 2rem 1.8rem 2rem 1.8rem;
      transition: all 0.15s ease;
    }

    /* tiny “email” header */
    .mail-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.4rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #eef3f8;
      color: #1e3b5c;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .mail-header span {
      font-size: 1.3rem;
      line-height: 1;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #5e7a97;
      margin-bottom: 0.4rem;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      background: #ffffff;
      border: 1.5px solid #dae3ec;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      color: #0b2a44;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #a7b9cc;
      font-weight: 400;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #2f6fae;
      box-shadow: 0 0 0 4px rgba(47, 111, 174, 0.08);
    }

    .field textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.5;
    }

    /* button – looks like an email “send” button */
    .send-btn {
      width: 100%;
      background: #1d4e7c;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem 1.2rem;
      border: none;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(29, 78, 124, 0.18);
      margin-top: 0.4rem;
    }

    .send-btn:hover {
      background: #0f3b5f;
      box-shadow: 0 8px 18px rgba(29, 78, 124, 0.22);
    }

    .send-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(29, 78, 124, 0.2);
    }

    .send-btn span {
      font-size: 1.1rem;
      line-height: 1;
    }

    /* small note / email hint */
    .form-footer {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.75rem;
      color: #7e96ae;
      border-top: 1px solid #edf2f8;
      padding-top: 1.2rem;
    }

    .form-footer code {
      background: #eef3f9;
      padding: 0.15rem 0.4rem;
      border-radius: 8px;
      font-size: 0.7rem;
      color: #1e3b5c;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <!-- simple "email" header -->
    <div class="mail-header">
      <span>✉️</span> Send a message
    </div>

    <!-- 
      The form uses "mailto:" to open the visitor's email client.
      Replace "hello@example.com" with your actual email address.
      Method POST isn't used because mailto handles it.
    -->
    <form action="mailto:hello@example.com" method="post" enctype="text/plain">
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Alex Rivera" required>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@domain.com" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message here…" required></textarea>
      </div>

      <!-- send button with tiny icon -->
      <button type="submit" class="send-btn">
        <span>📨</span> Send email
      </button>

      <div class="form-footer">
        ⚡ Opens your default email app · <code>mailto</code> form
      </div>
    </form>
  </div>

  <!-- 
    Optional note: the form uses "mailto:" to create an email draft.
    It's simple, works without backend, but relies on the visitor's 
    email client. 
  -->
</body>
</html>
